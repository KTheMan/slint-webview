[workspace]
members = [
    ".",
    "crates/core",
    "crates/native",
    "crates/mock",
    "crates/servo",
    "crates/cef",
]
resolver = "3"

[package]
name = "slint-webview"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native webview controller for Slint applications."
license = "LGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/KTheMan/slint-webview"
homepage = "https://github.com/KTheMan/slint-webview"
documentation = "https://docs.rs/slint-webview"
keywords = ["slint", "webview", "wry", "webview2", "webkitgtk"]
categories = ["gui", "web-programming", "api-bindings"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "RELEASE.md",
    "COPYING",
    "COPYING.LESSER",
    "crates/core/**",
    "crates/native/**",
    "crates/mock/**",
    "crates/servo/**",
    "crates/cef/**",
    "src/**",
    "ui/**",
    "tests/**",
    "examples/**",
    "fixtures/**",
    "docs/**",
    "scripts/**",
]
publish = false

[features]
default = ["backend-native"]
backend-native = ["backend-wry"]
backend-wry = ["slint-webview-native/backend-wry"]
backend-servo = ["dep:slint-webview-servo"]
backend-cef = ["dep:slint-webview-cef"]
testing = ["slint-webview-core/testing"]

[dependencies]
raw-window-handle = "0.6"
serde_json = "1"
slint-webview-core = { path = "crates/core", version = "0.1.0" }
slint-webview-native = { path = "crates/native", version = "0.1.0", default-features = false }
slint-webview-servo = { path = "crates/servo", version = "0.1.0", optional = true }
slint-webview-cef = { path = "crates/cef", version = "0.1.0", optional = true }
slint = { version = "=1.14.1", features = ["raw-window-handle-06"] }

[dev-dependencies]
slint-webview-mock = { path = "crates/mock", version = "0.1.0" }

[[bin]]
name = "slint-webview-regression"
path = "src/bin/regression_app.rs"
required-features = ["backend-wry", "testing"]
