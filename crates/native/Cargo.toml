[package]
name = "slint-webview-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Native platform webview backend for Slint webview composition."
license = "LGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/KTheMan/slint-webview"
publish = false

[features]
default = ["backend-wry"]
backend-wry = ["dep:wry", "dep:gtk", "dep:gdkx11", "dep:x11rb"]

[dependencies]
raw-window-handle = "0.6"
slint-webview-core = { path = "../core", version = "0.1.0" }
wry = { version = "0.55.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = { version = "0.18", optional = true }
gtk = { version = "0.18", optional = true }
x11rb = { version = "0.13", optional = true }
